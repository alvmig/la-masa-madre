# Publica la web (site/) en la raíz y las slides (slides/) en /slides/ del
# mismo dominio: https://alvmig.github.io/la-masa-madre/
# No es un build: solo ensambla el árbol estático y lo sube tal cual.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensamblar árbol público (site/ → / · slides/ → /slides/)
        run: |
          mkdir -p _site
          cp -R site/. _site/
          if [ -d slides ]; then
            mkdir -p _site/slides
            cp -R slides/. _site/slides/
          fi
          find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
